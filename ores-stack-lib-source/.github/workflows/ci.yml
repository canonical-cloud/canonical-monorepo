name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - name: Configure private dependency auth
        env:
          ORES_CLI_READ_TOKEN: ${{ secrets.ORES_CLI_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${ORES_CLI_READ_TOKEN}" ]]; then
            echo "ORES_CLI_READ_TOKEN is required for pinned private Rust dependencies" >&2
            exit 1
          fi

          token_file="${RUNNER_TEMP}/ores-cli-read-token"
          askpass_file="${RUNNER_TEMP}/ores-git-askpass.sh"
          umask 077
          printf '%s' "${ORES_CLI_READ_TOKEN}" > "${token_file}"
          cat > "${askpass_file}" <<'EOF'
          #!/usr/bin/env sh
          set -eu
          case "${1:-}" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) cat "${ORES_GIT_TOKEN_FILE}" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "${askpass_file}"
          {
            echo "ORES_GIT_TOKEN_FILE=${token_file}"
            echo "GIT_ASKPASS=${askpass_file}"
            echo "GIT_TERMINAL_PROMPT=0"
            echo "CARGO_NET_GIT_FETCH_WITH_CLI=true"
          } >> "${GITHUB_ENV}"
      - name: Materialize pinned Stack SDK conformance authority
        run: |
          set -euo pipefail
          interfaces_rev="e24f1e516186a9f68bf0f938f41e445f2a1cb4b9"
          interfaces_root="${RUNNER_TEMP}/ores-stack-interfaces"
          git init "${interfaces_root}"
          git -C "${interfaces_root}" remote add origin https://github.com/ores-stack/ores-stack-interfaces.git
          git -C "${interfaces_root}" fetch --depth=1 origin "${interfaces_rev}"
          git -C "${interfaces_root}" checkout --detach FETCH_HEAD
          actual="$(git -C "${interfaces_root}" rev-parse HEAD)"
          if [[ "${actual}" != "${interfaces_rev}" ]]; then
            echo "interfaces exact-source mismatch: expected ${interfaces_rev}, got ${actual}" >&2
            exit 1
          fi
          corpus="${interfaces_root}/conformance/stack-sdk-dev-v1.json"
          test -f "${corpus}"
          echo "ORES_STACK_SDK_CONFORMANCE=${corpus}" >> "${GITHUB_ENV}"
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      - name: Remove private dependency credentials
        if: always()
        run: |
          rm -f "${ORES_GIT_TOKEN_FILE:-}" "${GIT_ASKPASS:-}"
