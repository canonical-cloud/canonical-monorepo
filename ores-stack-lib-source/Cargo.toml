[package]
name = "ores-stack-lib-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Internal runtime contracts and validation for ORES Stack"
repository = "https://github.com/ores-stack/ores-stack-lib-core"

[dependencies]
ores-stack-pub-lib-core = { git = "https://github.com/ores-stack/ores-stack-pub-lib-core.git", rev = "5901b05f82b8985e522f59828a01c35ef3a9727a" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "net", "time"] }
trybuild = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
needless_return = "allow"
