name: Oreslang JVM LLVM cleanup-return shared fixture
on:
  push:
    branches: [ci/oreslang-pr628-cross-backend-20261011]
permissions:
  contents: read
jobs:
  java-shared:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact production source and identical LLVM fixture
        run: |
          test "$(git rev-parse HEAD:oreslang-java-build/src/main)" = "735e67c9d3a9b1a80f0a8dfe02b1e35d66541de2"
          test "$(git rev-parse HEAD:oreslang-java-build/src/test/java/dev/oreslang/SharedNativeDeferSourceParityTest.java)" = "af7028d58d8c4fba3bf3e9eef6ab93bf782118b8"
          test "$(git rev-parse HEAD:oreslang-java-build/contracts/v1/semantics/fixtures/native-defer-field-return.ores)" = "d2da4795ff4cdcadb313104e4ee6da4cd43fb2f7"
          test "$(git rev-parse HEAD:oreslang-java-build/src/test/java/dev/oreslang/CleanupReturnFinalityTest.java)" = "53d78be692a95d2bdf1c87c74135f76513839c4d"
          echo EXACT_GRAAL_SOURCE_AND_SHARED_LLVM_FIXTURE_OK
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: graalvm
          cache: maven
      - name: Execute shared fixture and cleanup ownership regressions
        working-directory: oreslang-java-build
        run: mvn -B -ntp -Dtest=CleanupReturnFinalityTest,SharedNativeDeferSourceParityTest,BindingMutabilityContractTest,NativeCollectionMemberRuntimeTest test
