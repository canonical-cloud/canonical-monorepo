name: Trusted Rust bootstrap security regression

on:
  pull_request:
    paths:
      - ".github/workflows/trusted-cargo-review.yml"
      - ".github/workflows/trusted-review-bootstrap-validation.yml"
      - ".github/scripts/**"
      - "scripts/check-cargo-git-sources.mjs"
      - "scripts/trusted-candidate-admission.mjs"
      - "tests/trusted-cargo-review-workflow.test.mjs"
      - "tests/trusted-candidate-admission.test.mjs"
      - "tests/offline-rust-review.test.mjs"
      - "tests/ci-private-cargo-askpass.test.mjs"
      - "tests/cargo-git-source-admission.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify immutable candidate commit and tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Exercise credential, reviewed-source and isolation adversaries
        run: |
          node --test \
            tests/trusted-cargo-review-workflow.test.mjs \
            tests/trusted-candidate-admission.test.mjs \
            tests/offline-rust-review.test.mjs \
            tests/ci-private-cargo-askpass.test.mjs \
            tests/cargo-git-source-admission.test.mjs

  bootstrap-cargo-sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout audited sandbox launcher from exact PR commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build fully equipped SHA-identified Rust test image before secrets
        shell: bash
        run: bash .github/scripts/prepare-rust-review-image.sh
      - name: Prove image cannot reach a network, write rootfs or gain capabilities
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp -d "$RUNNER_TEMP/offline-rust-smoke.XXXXXXXX")"
          trap 'rm -rf -- "$out"' EXIT
          docker run --rm --pull=never --network none --ipc none \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --pids-limit 256 \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --mount "type=bind,source=$out,target=/out" \
            --entrypoint /bin/bash "$RUST_SMOKE_IMAGE" -euo pipefail -c '
              rustc --version
              test "$(wc -l </proc/net/route)" -eq 1
              test ! -e /var/run/docker.sock
              test ! -w /
              test "$(awk "/^CapEff:/ {print \$2}" /proc/self/status)" = "0000000000000000"
              printf "fn main() {}\n" >/tmp/sandbox.rs
              rustc /tmp/sandbox.rs -o /out/sandbox
              /out/sandbox
            '
      - name: Run actual Cargo lock, fmt, Clippy and test in isolated container
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          workspace="$RUNNER_TEMP/rust-sandbox-fixture"
          cache="$RUNNER_TEMP/rust-sandbox-fixture-cache"
          mkdir -p "$cache"
          for project in canonical-web-server.rs canonical-api-server.rs; do
            dir="$workspace/apps/$project"
            mkdir -p "$dir/src"
            cat >"$dir/Cargo.toml" <<'TOML'
          [package]
          name = "sandbox_probe"
          version = "0.1.0"
          edition = "2024"
          TOML
            cat >"$dir/Cargo.lock" <<'LOCK'
          # This file is automatically @generated by Cargo.
          # It is not intended for manual editing.
          version = 4

          [[package]]
          name = "sandbox_probe"
          version = "0.1.0"
          LOCK
            cat >"$dir/src/lib.rs" <<'RUST'
          pub fn meaning() -> u32 {
              42
          }

          #[cfg(test)]
          mod tests {
              #[test]
              fn answer() {
                  assert_eq!(super::meaning(), 42);
              }
          }
          RUST
          done
          export GITHUB_WORKSPACE_ORIGINAL="$GITHUB_WORKSPACE"
          export GITHUB_WORKSPACE="$workspace"
          export CANONICAL_PRIVATE_CARGO_CACHE="$cache"
          export CANONICAL_RUST_IMAGE_ID="$RUST_SMOKE_IMAGE"
          for project in web api; do
            for mode in lock fmt clippy test; do
              bash "$GITHUB_WORKSPACE_ORIGINAL/.github/scripts/offline-rust-review.sh" "$project" "$mode"
            done
          done
