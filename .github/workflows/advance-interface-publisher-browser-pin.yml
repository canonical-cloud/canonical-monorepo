name: Advance reviewed browser and RMCP pins

on:
  push:
    branches: [sync/den-1371-interface-publisher-browser-pin]

permissions:
  contents: write

concurrency:
  group: den-1371-reviewed-leaf-pins-${{ github.ref }}
  cancel-in-progress: false

jobs:
  advance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true
      - name: Advance only reviewed descendant gitlinks
        shell: bash
        run: |
          set -euo pipefail

          workflow=.github/workflows/advance-interface-publisher-browser-pin.yml
          declare -A expected_old=(
            [apps/canonical-interfaces]=3ed810d6b184d4341efc2ae728957acc36732364
            [apps/canonical-marketing-site.web]=ad8e04b7c35769873d0cc32db0b55cf4a413d924
            [apps/canonical-mcp-server.rs]=cd6b87c7459ae533040389f72243d8d9a855de98
          )
          declare -A target=(
            [apps/canonical-interfaces]=fb95bac57c8957cd93fc53c505af2242a100f2b6
            [apps/canonical-marketing-site.web]=d0796f9e94e5fb512884c3f5abe7ef06ff2802a6
            [apps/canonical-mcp-server.rs]=3b95e0e25749607af6883594fe301b086ab2b16e
          )

          for path in \
            apps/canonical-interfaces \
            apps/canonical-marketing-site.web \
            apps/canonical-mcp-server.rs
          do
            old=$(git ls-tree HEAD "$path" | awk '{print $3}')
            if [[ "$old" != "${expected_old[$path]}" ]]; then
              echo "$path pin changed: expected ${expected_old[$path]}, found $old" >&2
              exit 1
            fi

            git -C "$path" fetch --no-tags origin \
              +refs/heads/main:refs/remotes/origin/main
            remote_main=$(git -C "$path" rev-parse refs/remotes/origin/main)
            if [[ "$remote_main" != "${target[$path]}" ]]; then
              echo "$path remote main moved: expected ${target[$path]}, found $remote_main" >&2
              exit 1
            fi
            if ! git -C "$path" merge-base --is-ancestor "$old" "${target[$path]}"; then
              echo "${target[$path]} does not descend from current pin $old for $path" >&2
              exit 1
            fi

            git -C "$path" checkout --detach "${target[$path]}"
            git add "$path"
          done

          git rm "$workflow"

          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            .github/workflows/advance-interface-publisher-browser-pin.yml
            apps/canonical-interfaces
            apps/canonical-marketing-site.web
            apps/canonical-mcp-server.rs
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected staged paths:\n' >&2
            printf '  %s\n' "${changed[@]}" >&2
            exit 1
          fi

          git diff --cached --check
          git diff --cached --submodule=log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Advance reviewed browser and RMCP leaf pins'
          git push origin HEAD:sync/den-1371-interface-publisher-browser-pin
