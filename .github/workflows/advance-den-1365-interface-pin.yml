name: Advance DEN-1365 certified interface pin

on:
  push:
    branches: [sync/den-1365-interface-wasm-pack]

permissions:
  contents: write

concurrency:
  group: den-1365-interface-pin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  advance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true
      - name: Advance only the reviewed descendant interface pin
        shell: bash
        run: |
          set -euo pipefail

          path=apps/canonical-interfaces
          target=3ed810d6b184d4341efc2ae728957acc36732364
          workflow=.github/workflows/advance-den-1365-interface-pin.yml

          old=$(git ls-tree HEAD "$path" | awk '{print $3}')
          test -n "$old"

          git -C "$path" fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          remote_main=$(git -C "$path" rev-parse refs/remotes/origin/main)

          if [[ "$remote_main" != "$target" ]]; then
            echo "$path remote main moved: expected $target, found $remote_main" >&2
            exit 1
          fi
          if [[ "$old" == "$target" ]]; then
            echo "$path already points at the certified interface commit" >&2
            exit 1
          fi
          if ! git -C "$path" merge-base --is-ancestor "$old" "$target"; then
            echo "$path target $target does not descend from current pin $old" >&2
            exit 1
          fi

          git -C "$path" checkout --detach "$target"
          git add "$path"
          git rm "$workflow"

          actual=$(git diff --cached --name-only | LC_ALL=C sort)
          expected=$(printf '%s\n' "$workflow" "$path" | LC_ALL=C sort)
          if [[ "$actual" != "$expected" ]]; then
            echo "Unexpected staged paths:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi

          git diff --cached --check
          git diff --cached --submodule=log

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Advance interface pin to certified wasm-pack 0.15 head"
          git push origin HEAD:sync/den-1365-interface-wasm-pack
