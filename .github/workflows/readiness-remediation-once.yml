name: one-shot readiness remediation

on:
  push:
    branches: [audit/release-ledger-least-privilege-20260915]
    paths:
      - '.github/workflows/readiness-remediation-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readiness-remediation-once
  cancel-in-progress: false

jobs:
  remediate:
    if: github.repository == 'canonical-cloud/canonical-monorepo' && github.ref == 'refs/heads/audit/release-ledger-least-privilege-20260915'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out exact remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/release-ledger-least-privilege-20260915
          fetch-depth: 0
          persist-credentials: false

      - name: Refresh exact read-only reusable-workflow allowlist
        shell: python
        run: |
          from pathlib import Path
          contract = Path('tests/ci-cd-contract.test.mjs')
          text = contract.read_text()
          old = 'ores-otel/.github/.github/workflows/source-policy-lint.yml@34a36017bfa4da0a820f4a82f8d206958296ebbb'
          new = 'ores-otel/.github/.github/workflows/source-policy-lint.yml@c417efc488bb4ca84e078fad9626f55b374913dd'
          if old not in text:
              raise SystemExit('expected source-policy allowlist revision not found')
          contract.write_text(text.replace(old, new))

      - name: Initialize public integration submodules
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive -- \
            apps/canonical-web-server.rs \
            apps/canonical-api-server.rs \
            apps/canonical-marketing-site.web \
            apps/canonical-interfaces \
            apps/canonical-mcp-server.rs

      - name: Validate repository contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --test tests/*.test.mjs

      - name: Commit verified non-workflow remediation
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add -- tests/ci-cd-contract.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: refresh exact source-policy contract pin'
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Publish verified non-workflow remediation
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" \
            push origin HEAD:refs/heads/audit/release-ledger-least-privilege-20260915
