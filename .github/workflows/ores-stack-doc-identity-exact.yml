name: ORES Stack exact-blob identity guards
on:
  push:
    branches: [ci/ores-stack-identity-guards-20261011]
    paths: [identity-guard-ready-20261011.txt]
permissions:
  contents: read
jobs:
  static-guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify every source blob before executing a copied guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ores-stack-org-source/README.md)" = "27bff5c6913c340b57c54c613f732560f980ead5"
          test "$(git rev-parse HEAD:ores-stack-org-source/profile/README.md)" = "a58e89c2c5643c0f378b35b360be2848cb145c94"
          test "$(git rev-parse HEAD:ores-stack-org-source/scripts/check-project-identity.py)" = "7600f752399ac592ba4fddb92c7186f9f187f660"
          test "$(git rev-parse HEAD:ores-stack-cli-docs-source/README.md)" = "b0e82bc7dcd5c271e7cee4edec6c594632c690f8"
          test "$(git rev-parse HEAD:ores-stack-cli-docs-source/Cargo.toml)" = "e00ce15a68e828204142be9778110df46bd458f9"
          test "$(git rev-parse HEAD:ores-stack-cli-docs-source/MIGRATION.md)" = "5db85a333e6020779763fb966b4b38d10b191de9"
          test "$(git rev-parse HEAD:ores-stack-cli-docs-source/tools/check-project-identity.py)" = "e55d1d3242a89827060284f9c22880caa385870d"
      - name: ORES Stack organization README and profile guard
        working-directory: ores-stack-org-source
        run: python3 scripts/check-project-identity.py
      - name: ORES Stack Rust CLI README and receipt guard
        working-directory: ores-stack-cli-docs-source
        run: python3 tools/check-project-identity.py
      # The pinned, audited file subset is sufficient for static documentation
      # tests; this job does not claim it compiled the complete Rust CLI.
