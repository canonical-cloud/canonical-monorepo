name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Use HTTPS for public submodule fetch
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize public integration submodules
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive -- \
            apps/canonical-web-server.rs \
            apps/canonical-api-server.rs \
            apps/canonical-marketing-site.web \
            apps/canonical-interfaces \
            apps/canonical-mcp-server.rs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: node --test tests/*.test.mjs
      - name: Audit public stack and private-submodule metadata
        run: bash scripts/audit-repo-state.sh --allow-uninitialized-private

  # The public PR gate runs in 'test'. Private Rust dependencies require
  # trusted protected-main code and a repository-scoped read-only secret.
  # Never hand a Cargo token to PR-controlled checkout/build scripts.
  integration-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Use HTTPS for public submodule fetch
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize public integration submodules
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive -- \
            apps/canonical-web-server.rs \
            apps/canonical-api-server.rs \
            apps/canonical-marketing-site.web \
            apps/canonical-interfaces \
            apps/canonical-mcp-server.rs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: |
            apps/canonical-web-server.rs
            apps/canonical-api-server.rs
      # The web workspace also depends on canonical-lib-core. Authenticate
      # BEFORE its first Cargo invocation, not only before API tests.
      - name: Authenticated Rust web, API and pinned-stack build
        env:
          PRIVATE_CARGO_TOKEN: ${{ secrets.CANONICAL_PRIVATE_CARGO_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PRIVATE_CARGO_TOKEN:-}" ]; then
            echo '::error::Private Cargo dependency admission is unavailable. Configure CANONICAL_PRIVATE_CARGO_READ_TOKEN with read-only access to canonical-cloud/canonical-lib-core; Rust integration was not executed.'
            exit 1
          fi

          # Credentials exist only for this trusted-main build step.
          askpass="$RUNNER_TEMP/canonical-private-cargo-askpass.sh"
          umask 077
          install -m 0700 scripts/private-cargo-askpass.sh "$askpass"
          trap 'rm -f -- "$askpass"' EXIT
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0
          export CARGO_NET_GIT_FETCH_WITH_CLI=true

          cargo test --locked \
            --manifest-path apps/canonical-web-server.rs/Cargo.toml \
            --workspace --all-targets
          cargo test --locked \
            --manifest-path apps/canonical-api-server.rs/Cargo.toml \
            --all-targets --all-features
          ./build.sh
      - name: Stack smoke (runtime contracts vs pinned interfaces)
        run: bash scripts/stack-smoke.sh

  private-sidecar-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          fetch-depth: 1
          persist-credentials: false
      # PR-controlled code cannot receive this private sidecar credential.
      # The gate also reports absence, never the credential itself.
      - name: Probe trusted private sidecar credential availability
        id: sidecar-auth
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PRIVATE_SUBMODULE_TOKEN: ${{ secrets.CANONICAL_PRIVATE_SUBMODULES_READ_TOKEN }}
        run: |
          if [ -n "${PRIVATE_SUBMODULE_TOKEN:-}" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Explain credential boundary when private read access is unavailable
        if: steps.sidecar-auth.outputs.available != 'true'
        run: >-
          echo 'Private sidecar source was not fetched. Private-source checkout is limited
          to trusted protected-main pushes with the configured read-only
          CANONICAL_PRIVATE_SUBMODULES_READ_TOKEN secret; PR checks are not private-source evidence.'
      - name: Check out private sidecar with repository-scoped read secret
        if: steps.sidecar-auth.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: canonical-cloud/canonical-sidecar.rs
          ref: main
          path: apps/canonical-sidecar.rs
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.CANONICAL_PRIVATE_SUBMODULES_READ_TOKEN }}
      - name: Verify pinned private sidecar is reachable from main
        if: steps.sidecar-auth.outputs.available == 'true'
        run: |
          set -euo pipefail
          pinned_sha="$(git rev-parse HEAD:apps/canonical-sidecar.rs)"
          git -C apps/canonical-sidecar.rs cat-file -e "${pinned_sha}^{commit}"
          git -C apps/canonical-sidecar.rs merge-base --is-ancestor "$pinned_sha" HEAD
          test "$(git config -f .gitmodules --get submodule.apps/canonical-sidecar.rs.private)" = true
          echo "private sidecar pin ${pinned_sha} is reachable from canonical-sidecar.rs/main"
