name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credential-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact commit and Git tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf 'Head: %s\nTree: %s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Validate credential isolation without private source or secrets
        run: node --test tests/private-cargo-auth.test.mjs tests/trusted-private-ci-boundary.test.mjs

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Use HTTPS for public submodule fetch
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize public integration submodules
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive -- \
            apps/canonical-web-server.rs \
            apps/canonical-api-server.rs \
            apps/canonical-marketing-site.web \
            apps/canonical-interfaces \
            apps/canonical-mcp-server.rs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: node --test tests/*.test.mjs
      - name: Audit public stack and private-submodule metadata
        run: bash scripts/audit-repo-state.sh --allow-uninitialized-private

  integration-build:
    needs: test
    # Only a reviewed push to protected main may expose private Cargo credentials.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'canonical-cloud/canonical-monorepo'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Use HTTPS for public submodule fetch
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify reviewed main commit and Git tree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
      - name: Initialize public integration submodules
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive -- \
            apps/canonical-web-server.rs \
            apps/canonical-api-server.rs \
            apps/canonical-marketing-site.web \
            apps/canonical-interfaces \
            apps/canonical-mcp-server.rs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: |
            apps/canonical-web-server.rs
            apps/canonical-api-server.rs
      - name: Fetch immutable private Rust dependencies without executing build code
        env:
          PRIVATE_CARGO_TOKEN: ${{ secrets.CANONICAL_PRIVATE_CARGO_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PRIVATE_CARGO_TOKEN:-}" ]; then
            echo '::error::Missing CANONICAL_PRIVATE_CARGO_READ_TOKEN for pinned private Canonical Rust dependencies; Rust builds were not started.'
            exit 1
          fi
          askpass="$RUNNER_TEMP/canonical-private-cargo-askpass.sh"
          cat >"$askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *github.com*) ;;
            *) exit 1 ;;
          esac
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$PRIVATE_CARGO_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$askpass"
          trap 'rm -f -- "$askpass"' EXIT
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0
          export CARGO_NET_GIT_FETCH_WITH_CLI=true
          cargo fetch --locked --manifest-path apps/canonical-web-server.rs/Cargo.toml
          cargo fetch --locked --manifest-path apps/canonical-api-server.rs/Cargo.toml
      - name: Rust web modularization contracts without credentials
        env:
          CARGO_NET_OFFLINE: "true"
        run: >-
          cargo test --locked
          --manifest-path apps/canonical-web-server.rs/Cargo.toml
          --workspace --all-targets
      - name: Rust API contracts without credentials
        env:
          CARGO_NET_OFFLINE: "true"
        run: >-
          cargo test --locked
          --manifest-path apps/canonical-api-server.rs/Cargo.toml
          --all-targets --all-features
      - name: Build the pinned public stack without credentials
        env:
          CARGO_NET_OFFLINE: "true"
        run: ./build.sh
      - name: Stack smoke (runtime contracts vs pinned interfaces)
        run: bash scripts/stack-smoke.sh

  private-sidecar-contract:
    # A private checkout is allowed only for a trusted push to protected main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'canonical-cloud/canonical-monorepo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact trusted superproject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify reviewed superproject and capture exact private gitlink
        id: pinned-sidecar
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          test "$(git config -f .gitmodules --get submodule.apps/canonical-sidecar.rs.private)" = true
          pinned_sha="$(git rev-parse HEAD:apps/canonical-sidecar.rs)"
          [[ "$pinned_sha" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$pinned_sha" >> "$GITHUB_OUTPUT"
      - name: Require approved read-only private sidecar credential
        env:
          PRIVATE_SUBMODULE_TOKEN: ${{ secrets.CANONICAL_PRIVATE_SUBMODULES_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PRIVATE_SUBMODULE_TOKEN:-}" ]]; then
            echo '::error::Required private sidecar pin could not be verified; configure read-only private sidecar checkout access.'
            exit 1
          fi
      - name: Check out exact immutable private sidecar gitlink
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: canonical-cloud/canonical-sidecar.rs
          ref: ${{ steps.pinned-sidecar.outputs.sha }}
          path: apps/canonical-sidecar.rs
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.CANONICAL_PRIVATE_SUBMODULES_READ_TOKEN }}
      - name: Verify exact private sidecar pin remains on origin/main
        env:
          PINNED_SIDECAR_SHA: ${{ steps.pinned-sidecar.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C apps/canonical-sidecar.rs rev-parse HEAD)" = "$PINNED_SIDECAR_SHA"
          git -C apps/canonical-sidecar.rs cat-file -e "${PINNED_SIDECAR_SHA}^{commit}"
          git -C apps/canonical-sidecar.rs merge-base --is-ancestor "$PINNED_SIDECAR_SHA" refs/remotes/origin/main
          echo "Verified exact pinned private sidecar commit $PINNED_SIDECAR_SHA on origin/main"
