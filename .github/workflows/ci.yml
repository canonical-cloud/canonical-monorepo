name: patch-contract-once
on:
  pull_request:
permissions:
  contents: write
jobs:
  patch:
    if: github.head_ref == 'agent/add-mcp-server-submodule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Add the MCP app to the contract inventory
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/monorepo-contract.test.mjs')
          text = path.read_text()
          text = text.replace('assert.equal(modules.length, 3);', 'assert.equal(modules.length, 4);')
          old = '''  assert.deepEqual(paths, [
            "apps/canonical-interfaces",
            "apps/canonical-marketing-site.web",
            "apps/canonical-web-server.rs",
          ]);'''
          new = '''  assert.deepEqual(paths, [
            "apps/canonical-interfaces",
            "apps/canonical-marketing-site.web",
            "apps/canonical-mcp-server.rs",
            "apps/canonical-web-server.rs",
          ]);'''
          if old not in text:
              raise SystemExit('expected Canonical inventory block not found')
          path.write_text(text.replace(old, new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/monorepo-contract.test.mjs
          git commit -m "Add Canonical MCP server to contract inventory"
          git push origin HEAD:${{ github.head_ref }}
