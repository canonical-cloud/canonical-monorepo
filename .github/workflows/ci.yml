name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credential-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact commit and Git tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf 'Head: %s\nTree: %s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Validate credential isolation without private source or secrets
        run: node --test tests/ci-private-cargo-askpass.test.mjs tests/offline-rust-review.test.mjs tests/public-frontend-artifact.test.mjs tests/private-cargo-auth.test.mjs tests/trusted-private-ci-boundary.test.mjs tests/trusted-cargo-review-workflow.test.mjs tests/trusted-candidate-admission.test.mjs

  offline-container-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout audited sandbox launcher from exact PR commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build fully equipped SHA-identified Rust test image before secrets
        shell: bash
        run: bash .github/scripts/prepare-rust-review-image.sh
      - name: Prove image cannot reach a network, write rootfs or gain capabilities
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp -d "$RUNNER_TEMP/offline-rust-smoke.XXXXXXXX")"
          trap 'rm -rf -- "$out"' EXIT
          docker run --rm --pull=never --network none --ipc none \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --pids-limit 256 \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --mount "type=bind,source=$out,target=/out" \
            --entrypoint /bin/bash "$RUST_SMOKE_IMAGE" -euo pipefail -c '
              rustc --version
              test "$(wc -l </proc/net/route)" -eq 1
              test ! -e /var/run/docker.sock
              test ! -w /
              test "$(awk "/^CapEff:/ {print \$2}" /proc/self/status)" = "0000000000000000"
              printf "fn main() {}\n" >/tmp/sandbox.rs
              rustc /tmp/sandbox.rs -o /out/sandbox
              /out/sandbox
            '
      - name: Run actual Cargo lock, fmt, Clippy and test in isolated container
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          workspace="$RUNNER_TEMP/rust-sandbox-fixture"
          cache="$RUNNER_TEMP/rust-sandbox-fixture-cache"
          mkdir -p "$cache"
          for project in canonical-web-server.rs canonical-api-server.rs; do
            dir="$workspace/apps/$project"
            mkdir -p "$dir/src"
            cat >"$dir/Cargo.toml" <<'TOML'
          [package]
          name = "sandbox_probe"
          version = "0.1.0"
          edition = "2024"
          TOML
            cat >"$dir/Cargo.lock" <<'LOCK'
          # This file is automatically @generated by Cargo.
          # It is not intended for manual editing.
          version = 4

          [[package]]
          name = "sandbox_probe"
          version = "0.1.0"
          LOCK
            cat >"$dir/src/lib.rs" <<'RUST'
          pub fn meaning() -> u32 {
              42
          }

          #[cfg(test)]
          mod tests {
              #[test]
              fn answer() {
                  assert_eq!(super::meaning(), 42);
              }
          }
          RUST
          done
          # The API release path must compile an actual binary, not merely a
          # library/test fixture. No private source or credentials are present.
          mkdir -p "$workspace/apps/canonical-api-server.rs/src/bin"
          cat >"$workspace/apps/canonical-api-server.rs/src/bin/canonical-api-server.rs" <<'RUST'
          fn main() {}
          RUST
          export GITHUB_WORKSPACE_ORIGINAL="$GITHUB_WORKSPACE"
          export GITHUB_WORKSPACE="$workspace"
          export CANONICAL_PRIVATE_CARGO_CACHE="$cache"
          export CANONICAL_RUST_IMAGE_ID="$RUST_SMOKE_IMAGE"
          for project in web api; do
            for mode in lock fmt clippy test; do
              bash "$GITHUB_WORKSPACE_ORIGINAL/.github/scripts/offline-rust-review.sh" "$project" "$mode"
            done
          done
          bash "$GITHUB_WORKSPACE_ORIGINAL/.github/scripts/offline-rust-review.sh" api release
  git-source-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: false
          persist-credentials: false
      - name: Require exact reviewed candidate and log tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
      - name: Fetch only public pinned Rust source gitlinks
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive -- apps/canonical-web-server.rs apps/canonical-api-server.rs
          for app in apps/canonical-web-server.rs apps/canonical-api-server.rs; do
            test "$(git -C "$app" rev-parse HEAD)" = "$(git rev-parse "HEAD:$app")"
          done
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Test fixed Git source admission policy
        run: node --test tests/cargo-git-source-admission.test.mjs
      - name: Verify both actual Cargo manifests and lockfiles without private credentials
        run: node scripts/check-cargo-git-sources.mjs

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Use HTTPS for public submodule fetch
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize public integration submodules
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive -- \
            apps/canonical-web-server.rs \
            apps/canonical-api-server.rs \
            apps/canonical-marketing-site.web \
            apps/canonical-interfaces \
            apps/canonical-mcp-server.rs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: node --test tests/*.test.mjs
      - name: Audit public stack and private-submodule metadata
        run: bash scripts/audit-repo-state.sh --allow-uninitialized-private

  integration-build:
    needs: [test, isolated-stack-build, public-artifact-contract]
    # Only a reviewed push to protected main may expose private Cargo credentials.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'canonical-cloud/canonical-monorepo'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Use HTTPS for public submodule fetch
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify reviewed main commit and Git tree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
      - name: Initialize public integration submodules
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive -- \
            apps/canonical-web-server.rs \
            apps/canonical-api-server.rs \
            apps/canonical-marketing-site.web \
            apps/canonical-interfaces \
            apps/canonical-mcp-server.rs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Download exact-run public frontend artifact before private dependency access
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: canonical-public-frontends-${{ github.sha }}
          path: ${{ runner.temp }}/canonical-public-download
      - name: Validate public artifact and source commit before private dependency access
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/canonical-public-verified"
          python3 .github/scripts/verify-public-frontends.py \
            "$RUNNER_TEMP/canonical-public-download/canonical-public-frontends.tar.gz" \
            "$output" "$GITHUB_SHA"
          echo "CANONICAL_PUBLIC_ASSETS_ROOT=$output" >> "$GITHUB_ENV"
      - name: Prepare full Rust tools and isolated private cache before credential
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/prepare-rust-review-image.sh
          cache="$RUNNER_TEMP/canonical-main-private-cargo-cache"
          mkdir -p "$cache"
          chmod 0700 "$cache"
          echo "CANONICAL_PRIVATE_CARGO_CACHE=$cache" >> "$GITHUB_ENV"
      - name: Install matching host Rust toolchain for fetch-only phase
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Reject unexpected Git origins before private Cargo credential is exposed
        run: node scripts/check-cargo-git-sources.mjs
      - name: Fetch immutable private Rust dependencies without executing build code
        env:
          PRIVATE_CARGO_TOKEN: ${{ secrets.CANONICAL_PRIVATE_CARGO_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PRIVATE_CARGO_TOKEN:-}" ]; then
            echo '::error::Missing CANONICAL_PRIVATE_CARGO_READ_TOKEN for pinned private Canonical Rust dependencies; Rust builds were not started.'
            exit 1
          fi
          askpass="$RUNNER_TEMP/canonical-private-cargo-askpass.sh"
          install -m 0700 .github/scripts/private-cargo-askpass.sh "$askpass"
          trap 'rm -f -- "$askpass"' EXIT
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0
          export CARGO_NET_GIT_FETCH_WITH_CLI=true
          export CARGO_HOME="$CANONICAL_PRIVATE_CARGO_CACHE"
          cargo +1.95.0 fetch --locked --manifest-path apps/canonical-web-server.rs/Cargo.toml
          cargo +1.95.0 fetch --locked --manifest-path apps/canonical-api-server.rs/Cargo.toml
      - name: Verify Rust lockfiles, full target matrix, and isolated release smoke
        shell: bash
        run: |
          set -euo pipefail
          for app in web api; do
            for mode in lock fmt clippy test release; do
              bash .github/scripts/offline-rust-review.sh "$app" "$mode"
            done
          done

  # Frontend verification runs on a separate fresh runner without private
  # Cargo source, cache, helper or token. The Rust release binaries and stack
  # runtime smoke run only inside the networkless private-cache sandbox.
  # This independent frontend job remains a required protected-main gate.
  isolated-stack-build:
    # Public frontend only: safe to validate the exact PR source without
    # private dependency credentials or caches.
    if: github.repository == 'canonical-cloud/canonical-monorepo'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Checkout reviewed main without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: false
          persist-credentials: false
      - name: Verify exact Git tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse 'HEAD^{tree}'
      - name: Initialize only reviewed public application gitlinks
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive -- \
            apps/canonical-web-server.rs \
            apps/canonical-api-server.rs \
            apps/canonical-marketing-site.web \
            apps/canonical-interfaces \
            apps/canonical-mcp-server.rs
      - name: Verify public frontends without private Rust dependency sources
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: bash .github/scripts/build-public-frontends.sh
      - name: Package strictly public frontend dist files and SHA
        shell: bash
        env:
          CANONICAL_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/package-public-frontends.sh
      - name: Upload only public frontend archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canonical-public-frontends-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/canonical-public-frontends.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  public-artifact-contract:
    needs: isolated-stack-build
    if: github.repository == 'canonical-cloud/canonical-monorepo'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact public candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify candidate Git commit and tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse 'HEAD^{tree}'
      - name: Download only the public frontend artifact from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: canonical-public-frontends-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/public-download
      - name: Validate real public-only archive contents and exact commit
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-public-frontends.py \
            "$RUNNER_TEMP/public-download/canonical-public-frontends.tar.gz" \
            "$RUNNER_TEMP/public-artifact-verified" "$EXPECTED_HEAD"

  private-sidecar-contract:
    # A private checkout is allowed only for a trusted push to protected main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'canonical-cloud/canonical-monorepo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact trusted superproject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify reviewed superproject and capture exact private gitlink
        id: pinned_sidecar
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          test "$(git config -f .gitmodules --get submodule.apps/canonical-sidecar.rs.private)" = true
          pinned_sha="$(git rev-parse HEAD:apps/canonical-sidecar.rs)"
          [[ "$pinned_sha" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$pinned_sha" >> "$GITHUB_OUTPUT"
      - name: Require approved read-only private sidecar credential
        env:
          PRIVATE_SUBMODULE_TOKEN: ${{ secrets.CANONICAL_PRIVATE_SUBMODULES_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PRIVATE_SUBMODULE_TOKEN:-}" ]]; then
            echo '::error::Required private sidecar pin could not be verified; configure read-only private sidecar checkout access.'
            exit 1
          fi
      - name: Check out exact immutable private sidecar gitlink
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: canonical-cloud/canonical-sidecar.rs
          ref: ${{ steps.pinned_sidecar.outputs.sha }}
          path: apps/canonical-sidecar.rs
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.CANONICAL_PRIVATE_SUBMODULES_READ_TOKEN }}
      - name: Verify exact private sidecar pin remains on origin/main
        env:
          PINNED_SIDECAR_SHA: ${{ steps.pinned_sidecar.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C apps/canonical-sidecar.rs rev-parse HEAD)" = "$PINNED_SIDECAR_SHA"
          git -C apps/canonical-sidecar.rs cat-file -e "${PINNED_SIDECAR_SHA}^{commit}"
          git -C apps/canonical-sidecar.rs merge-base --is-ancestor "$PINNED_SIDECAR_SHA" refs/remotes/origin/main
          echo "Verified exact pinned private sidecar commit $PINNED_SIDECAR_SHA on origin/main"
