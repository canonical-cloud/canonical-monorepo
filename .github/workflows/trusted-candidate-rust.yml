name: Trusted candidate Rust verification
on:
  workflow_dispatch:
    inputs:
      web_pr:
        description: Number of an approved canonical-web-server.rs pull request
        required: true
        type: string
      web_head:
        description: Exact reviewed 40-character web SHA
        required: true
        type: string
      web_tree:
        description: Expected 40-character Git tree SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: trusted-candidate-rust
  cancel-in-progress: false
jobs:
  admission:
    if: github.repository == 'canonical-cloud/canonical-monorepo' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      web_head: ${{ steps.verify.outputs.web_head }}
      web_tree: ${{ steps.verify.outputs.web_tree }}
    steps:
      - name: Authorize an immutable, independently approved web PR commit
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.web_pr }}
          SHA: ${{ inputs.web_head }}
          TREE: ${{ inputs.web_tree }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[1-9][0-9]{0,7}$ ]]
          [[ "$SHA" =~ ^[0-9a-f]{40}$ && "$TREE" =~ ^[0-9a-f]{40}$ ]]
          repo='canonical-cloud/canonical-web-server.rs'
          body="$(gh api "repos/$repo/pulls/$PR")"
          jq -e --arg sha "$SHA" '
            .state == "open" and .draft == false and .base.ref == "main"
            and .head.sha == $sha and .head.repo.full_name == "canonical-cloud/canonical-web-server.rs"
            and any(.labels[]?; .name == "trusted-private-ci")
          ' <<<"$body" >/dev/null
          author="$(jq -r '.user.login' <<<"$body")"
          reviews="$(gh api "repos/$repo/pulls/$PR/reviews?per_page=100")"
          jq -e --arg sha "$SHA" --arg author "$author" '
            sort_by(.submitted_at) | group_by(.user.login) | map(.[-1]) |
            any(.state == "APPROVED" and .commit_id == $sha and
              .user.login != $author and
              (.author_association == "OWNER" or .author_association == "MEMBER" or
               .author_association == "COLLABORATOR"))
          ' <<<"$reviews" >/dev/null
          actual_tree="$(gh api "repos/$repo/git/commits/$SHA" --jq '.tree.sha')"
          test "$actual_tree" = "$TREE"
          echo "web_head=$SHA" >> "$GITHUB_OUTPUT"
          echo "web_tree=$TREE" >> "$GITHUB_OUTPUT"
          printf 'Approved head: %s; verified Git tree: %s\n' "$SHA" "$TREE"

  rust:
    needs: admission
    if: github.repository == 'canonical-cloud/canonical-monorepo' && github.ref == 'refs/heads/main'
    environment: canonical-private-candidate-review
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    permissions:
      contents: read
    env:
      WEB_HEAD: ${{ needs.admission.outputs.web_head }}
      WEB_TREE: ${{ needs.admission.outputs.web_tree }}
      CARGO_HOME: ${{ runner.temp }}/candidate-cargo
    steps:
      - name: Checkout trusted main code, exact dispatch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          submodules: false
          persist-credentials: false
      - name: Checkout and verify approved public candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'Trusted main tree: %s\n' "$(git rev-parse 'HEAD^{tree}')"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive -- \
            apps/canonical-web-server.rs apps/canonical-api-server.rs \
            apps/canonical-marketing-site.web apps/canonical-interfaces apps/canonical-mcp-server.rs
          git -C apps/canonical-web-server.rs fetch origin "$WEB_HEAD"
          git -C apps/canonical-web-server.rs checkout --detach "$WEB_HEAD"
          test "$(git -C apps/canonical-web-server.rs rev-parse HEAD)" = "$WEB_HEAD"
          test "$(git -C apps/canonical-web-server.rs rev-parse 'HEAD^{tree}')" = "$WEB_TREE"
          test ! -e apps/canonical-web-server.rs/.cargo/config
          test ! -e apps/canonical-web-server.rs/.cargo/config.toml
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Prepare isolated Cargo home
        run: mkdir -p "$CARGO_HOME"
      - name: Fetch locked Git dependencies with temporary read-only credential
        shell: bash
        env:
          PRIVATE_CARGO_TOKEN: ${{ secrets.CANONICAL_PRIVATE_CARGO_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${PRIVATE_CARGO_TOKEN:-}" ]]; then
            echo "::error::Approved private Cargo read credential is unavailable"
            exit 1
          fi
          askpass="$RUNNER_TEMP/trusted-candidate-askpass.sh"
          cat >"$askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *https://github.com/*) ;;
            *) exit 1 ;;
          esac
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$PRIVATE_CARGO_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$askpass"
          trap 'rm -f -- "$askpass"' EXIT
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0
          export CARGO_NET_GIT_FETCH_WITH_CLI=true
          cargo fetch --locked --manifest-path apps/canonical-web-server.rs/Cargo.toml
          cargo fetch --locked --manifest-path apps/canonical-api-server.rs/Cargo.toml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Verify lockfile reproducibility with no credentials
        shell: bash
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          set -euo pipefail
          cp apps/canonical-web-server.rs/Cargo.lock "$RUNNER_TEMP/checked-web.lock"
          cargo generate-lockfile --offline --manifest-path apps/canonical-web-server.rs/Cargo.toml
          cmp "$RUNNER_TEMP/checked-web.lock" apps/canonical-web-server.rs/Cargo.lock
      - name: Build, lint and test offline without private credential
        shell: bash
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          set -euo pipefail
          cargo clippy --manifest-path apps/canonical-web-server.rs/Cargo.toml --workspace --all-targets --locked -- -D warnings
          cargo test --manifest-path apps/canonical-web-server.rs/Cargo.toml --workspace --all-targets --locked
          cargo test --manifest-path apps/canonical-api-server.rs/Cargo.toml --all-features --all-targets --locked
          ./build.sh
      - name: Verify source tree remains exactly approved
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C apps/canonical-web-server.rs rev-parse HEAD)" = "$WEB_HEAD"
          test "$(git -C apps/canonical-web-server.rs rev-parse 'HEAD^{tree}')" = "$WEB_TREE"
          test -z "${PRIVATE_CARGO_TOKEN:-}"
