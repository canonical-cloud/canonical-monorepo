name: Advance reviewed submodule pins

on:
  push:
    branches: [agent/den-127-finalize-hierarchy]

permissions:
  contents: write

concurrency:
  group: den-127-pin-submodules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  advance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true
      - name: Advance only reviewed descendant pins
        shell: bash
        run: |
          set -euo pipefail

          declare -A targets=(
            [apps/canonical-interfaces]=2fa220f6032768ed33c7e8fd157104a31baec8a8
            [apps/canonical-marketing-site.web]=0e9d0252bac4bc48c51f711f367e6b6278625ad9
            [apps/canonical-mcp-server.rs]=c4b0d8b5e16fdb8069665ba8901cd6eb98fc2bfa
            [apps/canonical-web-server.rs]=c9fccd22ec6cca035a008937df444a3e125023bd
          )

          for path in \
            apps/canonical-interfaces \
            apps/canonical-marketing-site.web \
            apps/canonical-mcp-server.rs \
            apps/canonical-web-server.rs
          do
            old=$(git ls-tree HEAD "$path" | awk '{print $3}')
            target=${targets[$path]}
            git -C "$path" fetch --no-tags origin \
              +refs/heads/main:refs/remotes/origin/main
            remote_main=$(git -C "$path" rev-parse refs/remotes/origin/main)

            if [[ "$remote_main" != "$target" ]]; then
              echo "$path remote main moved: expected $target, found $remote_main" >&2
              exit 1
            fi
            if ! git -C "$path" merge-base --is-ancestor "$old" "$target"; then
              echo "$path target $target does not descend from current pin $old" >&2
              exit 1
            fi

            git -C "$path" checkout --detach "$target"
            git add "$path"
          done

          git rm .github/workflows/advance-reviewed-submodule-pins.yml
          git diff --cached --check
          git diff --cached --submodule=log

          if git diff --cached --quiet; then
            echo "No reviewed pin advancement was required." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Advance submodules to reviewed hierarchy heads"
          git push origin HEAD:agent/den-127-finalize-hierarchy