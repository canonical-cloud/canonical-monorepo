name: Oreslang async I/O source-free canary

on:
  push:
    branches:
      - 'ci/oreslang-async-io-*'
    paths:
      - '.github/workflows/oreslang-async-io-source-free.yml'
      - 'ci/async-io-source-free-policy.test.mjs'
      - 'ci/NioSingleCarrierCanary.java'
  pull_request:
    paths:
      - '.github/workflows/oreslang-async-io-source-free.yml'
      - 'ci/async-io-source-free-policy.test.mjs'
      - 'ci/NioSingleCarrierCanary.java'

permissions:
  contents: read

jobs:
  source-free-async-io:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Show runtime
        run: node --version
      - name: Run source-free async I/O policy suite
        run: node --test ci/async-io-source-free-policy.test.mjs
      - name: Compile source-free JDK NIO one-carrier canary
        run: javac --release 17 -Xlint:all -Werror -d /tmp/ores-nio-canary ci/NioSingleCarrierCanary.java
      - name: Run source-free JDK NIO one-carrier canary
        run: java -cp /tmp/ores-nio-canary NioSingleCarrierCanary
