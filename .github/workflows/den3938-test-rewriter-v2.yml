name: DEN-3938 temporary integration repinner

on:
  push:
    branches:
      - DEN-3938/hardened-persistence-consumers
    paths:
      - ".github/workflows/den3938-test-rewriter-v2.yml"

permissions:
  contents: write

jobs:
  repin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: DEN-3938/hardened-persistence-consumers
          persist-credentials: true
          fetch-depth: 1
      - name: Repin current DEN-3938 consumer heads
        shell: bash
        run: |
          set -euo pipefail
          old='5547c4c2f5c177be83788b3976505a5c942a991b'
          new='ad04984b227b0f2bcca1d8dc6ee858bd58a46f94'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/monorepo-contract.test.mjs')
          s=p.read_text()
          old='5547c4c2f5c177be83788b3976505a5c942a991b'
          new='ad04984b227b0f2bcca1d8dc6ee858bd58a46f94'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one stale ORM assertion, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          git update-index --cacheinfo 160000,a0a2c7737aaf241ac4c991eef3e2a2da0a29b069,apps/canonical-api-server.rs
          git update-index --cacheinfo 160000,6b0739a694c2404603021df4edb6b825320258fa,apps/canonical-web-server.rs
          git update-index --cacheinfo 160000,d64591ca33a0957af55ae853973a33403e525940,apps/canonical-mcp-server.rs
          git diff --check
          actual="$(git diff --cached --name-only; git diff --name-only)"
          expected="$(printf '%s\n' apps/canonical-api-server.rs apps/canonical-mcp-server.rs apps/canonical-web-server.rs tests/monorepo-contract.test.mjs | sort)"
          test "$(printf '%s\n' "$actual" | sed '/^$/d' | sort -u)" = "$expected"
          grep -F "$new" tests/monorepo-contract.test.mjs
          ! grep -F "$old" tests/monorepo-contract.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/monorepo-contract.test.mjs
          git commit -m 'DEN-3938: repin current hardened persistence consumers'
          git push origin HEAD:DEN-3938/hardened-persistence-consumers
