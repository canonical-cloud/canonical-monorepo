name: PR8 native Oreslang generator against pinned Java Graal runtime
on:
  push:
    branches: [ci/oreslang-cli-pr8-native-java-exact-20261011]
    paths: [ci-pr8-native-generator-ready.txt]
permissions:
  contents: read
jobs:
  graal-native-generator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify native Java build inputs and PR8 exact Git identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:oreslang-java-build/src/main)" = "bf123f8b2b2691e63b1b9007ca46b450275dd06b"
          test "$(git rev-parse HEAD:oreslang-java-build/stdlib)" = "1efcbd5a356706f9ab71f022bc1c9c2e83e3d106"
          test "$(git rev-parse HEAD:oreslang-java-build/pom.xml)" = "2fbedd1086357c7c6385ba439c42f4315f050974"
          test "$(git rev-parse HEAD:oreslang-java-build/scripts/build-native-thread.sh)" = "d7d79b3af7aae08a5277fe63ca6b6047c0da9aa6"
          test "$(git rev-parse HEAD:oreslang-cli-pr8)" = "4e0c22571664fa2027c210ce2b2286b1ab57caa5"
          echo "All Java build inputs and CLI source match the pinned upstream Git objects"
      - name: Install GraalVM JDK 25
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          java-version: "25"
          version: "25.3"
          distribution: graalvm
          cache: maven
      - name: Verify GraalVM JDK and build runtime Java sources
        working-directory: oreslang-java-build
        shell: bash
        run: |
          set -euo pipefail
          java --version
          mvn --version
          mvn -B -ntp -Dmaven.test.skip=true package
          mvn -B -ntp -DskipTests dependency:build-classpath -Dmdep.outputFile=target/classpath.txt
          test -s target/classpath.txt
          test -f target/classes/dev/oreslang/launcher/OresMain.class
      - name: Build pinned public flags-2-env parser
        shell: bash
        run: |
          set -euo pipefail
          git init /tmp/flags-2-env
          git -C /tmp/flags-2-env remote add origin https://github.com/flags-2-env/flags-2-env.git
          git -C /tmp/flags-2-env fetch --depth=1 origin 7da1ea0a67b43ee3e523e28b5bc4757cc886d3b9
          git -C /tmp/flags-2-env checkout --detach FETCH_HEAD
          test "$(git -C /tmp/flags-2-env rev-parse HEAD)" = "7da1ea0a67b43ee3e523e28b5bc4757cc886d3b9"
          make -C /tmp/flags-2-env cli
          echo "/tmp/flags-2-env/build" >> "$GITHUB_PATH"
      - name: Run native Java launcher and Oreslang guest compiler smoke
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/oreslang-java-runtime <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          root="$GITHUB_WORKSPACE/oreslang-java-build"
          exec java --enable-native-access=ALL-UNNAMED \
            -p "$root/target/classes:$(cat "$root/target/classpath.txt")" \
            -m dev.oreslang/dev.oreslang.launcher.OresMain "$@"
          EOF
          chmod +x /tmp/oreslang-java-runtime
          /tmp/oreslang-java-runtime --build-info
          /tmp/oreslang-java-runtime --check "$GITHUB_WORKSPACE/oreslang-cli-pr8/src/main.ores"
      - name: Execute real native-generator integration suite (NO MOCK)
        working-directory: oreslang-cli-pr8
        shell: bash
        env:
          ORESLANG_BIN: /tmp/oreslang-java-runtime
        run: |
          set -euo pipefail
          timeout 900 bash tests/native-generator-contract.sh
      # Java/Graal guest-runtime integration only; no AOT/LLVM certification.
      # No private cross-organization checkout, credentials, or new secrets.
