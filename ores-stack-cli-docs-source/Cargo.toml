[workspace]
resolver = "2"
members = [
  "crates/ores-stack-core",
  "crates/ores-stack-cli",
  "crates/ores-stack-ppr-http",
  "crates/ores-stack-process-tree",
  "crates/ores-stack-p2-edge-minimal",
  "fixtures/axum-web-server",
]
# Provider adapters intentionally remain a standalone proof crate so their
# dependency graph cannot inherit ores-stack workspace feature unification.
exclude = ["crates/ores-fn-adapters"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ores-stack/ores-stack-cli"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "allow"
